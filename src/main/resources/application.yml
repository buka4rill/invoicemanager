spring:
  datasource:
    url: jdbc:mysql://localhost:3306/invoicemanager
    password: invoicemanager
    username: invoicemanager
  jpa:
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
  sql:
    init:
      mode: never