services:
  mysql:
    image: mysql:8.4
    container_name: invoicemanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invoicemanager
      MYSQL_USER: invoicemanager
      MYSQL_PASSWORD: invoicemanager
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - invoicemanager-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoicemanager-mysql-data:
